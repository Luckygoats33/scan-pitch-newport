<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newport Business Demos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#e8e8e8}
.wrap{max-width:600px;width:90%;text-align:center;padding:4rem 2rem}
h1{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:.5rem;letter-spacing:-.02em}
p{color:#888;margin-bottom:3rem;font-size:.95rem}
.cards{display:grid;gap:1.5rem}
a{display:block;padding:2rem;border:1px solid #222;border-radius:12px;text-decoration:none;color:#e8e8e8;transition:border-color .3s,transform .3s}
a:hover{border-color:#555;transform:translateY(-2px)}
.name{font-size:1.3rem;font-weight:600;margin-bottom:.25rem}
.desc{color:#888;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<h1>Newport, Oregon</h1>
<p>Premium website demos for local businesses</p>
<div class="cards">
<a href="bay-haven-inn/">
<div class="name">Bay Haven Inn</div>
<div class="desc">Newport's Original Waterfront Bar &middot; Est. 1908</div>
</a>
<a href="kings-barber-shop/">
<div class="name">King's Barber Shop</div>
<div class="desc">Classic Cuts &middot; Straight Razor Shaves &middot; Newport, OR</div>
</a>
</div>
</div>
</body>
</html>
